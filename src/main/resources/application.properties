# =====================================================================
#  MundoTerraza - Configuración base
#  Perfiles:
#    dev  -> desarrollo local con MySQL en Podman
#    prod -> producción (pendiente)
#  Ejecutar en dev:
#    mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =====================================================================

spring.application.name=mundo-terraza
server.port=8080

# --------------------------- DataSource ------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/mundo_terraza_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=terraza
spring.datasource.password=terraza123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ------------------------------- JPA ---------------------------------
# validate: Hibernate valida el esquema contra las migraciones Flyway.
# Cambiar temporalmente a 'none' hasta que existan migraciones.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ------------------------------ Flyway -------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ------------------------------ Jackson ------------------------------
spring.jackson.time-zone=America/Lima
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# -------------------------- Subida de archivos -----------------------
app.upload-dir=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# -------------------------------- JWT --------------------------------
# En producción reemplazar por variable de entorno JWT_SECRET
# Mínimo 256 bits (32 caracteres) para HS256.
app.jwt.secret=${JWT_SECRET:dev-secret-change-me-mundoterraza-256bits-minimum}
app.jwt.access-expiration-minutes=15
app.jwt.refresh-expiration-days=7

# --------------------- Seguridad de la cuenta ------------------------
app.security.max-failed-attempts=5
app.security.lock-duration-minutes=15

# ------------------------------- CORS --------------------------------
app.cors.allowed-origins=http://localhost:8080

# ----------------------------- OpenAPI -------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ---------------------------- Paginación -----------------------------
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# --------------------------- Configuración ---------------------------
spring.config.import=optional:application-dev.properties

# ------------------------------ Logging ------------------------------
logging.level.root=INFO
logging.level.app=DEBUG
logging.level.app.infrastructure.security=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.org.flywaydb=INFO
