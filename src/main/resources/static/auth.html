<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MundoTerraza - Iniciar Sesión o Registrarse</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="auth">
    <div class="auth__card">

      <a href="index.html" class="auth__brand">
        <span>MundoTerraza</span>
      </a>

      <div class="tabs">
        <button type="button" class="tabs__item tabs__item--active" data-tab="loginPanel">Ingresar</button>
        <button type="button" class="tabs__item" data-tab="registerPanel">Registrarse</button>
      </div>

      <!-- PANEL: LOGIN -->
      <div id="loginPanel" class="tab-pane tab-pane--active">
        <div id="loginError" class="alert alert--danger is-hidden"></div>

        <form id="loginForm" autocomplete="off" novalidate>
          <div class="form-group">
            <label class="form-label" for="loginCorreo">Correo Electrónico</label>
            <input type="email" id="loginCorreo" name="loginCorreo" class="form-input form-input--lg"
                   placeholder="nombre@correo.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">Contraseña</label>
            <input type="password" id="loginPassword" name="loginPassword" class="form-input form-input--lg"
                   placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn--primary btn--lg btn--block">Ingresar</button>
        </form>
      </div>

      <!-- PANEL: REGISTRO -->
      <div id="registerPanel" class="tab-pane">
        <div id="registerError" class="alert alert--danger is-hidden"></div>

        <form id="registerForm" autocomplete="off" novalidate>
          <div class="form-group">
            <label class="form-label" for="regNombre">Nombre Completo</label>
            <input type="text" id="regNombre" name="regNombre" class="form-input form-input--lg"
                   placeholder="Tu nombre" minlength="2" maxlength="100" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regCorreo">Correo Electrónico</label>
            <input type="email" id="regCorreo" name="regCorreo" class="form-input form-input--lg"
                   placeholder="nombre@correo.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="regPassword">Contraseña</label>
            <input type="password" id="regPassword" name="regPassword" class="form-input form-input--lg"
                   placeholder="Crear contraseña" minlength="6" maxlength="72" required>
          </div>

          <button type="submit" class="btn btn--primary btn--lg btn--block">Crear Cuenta</button>
        </form>
      </div>

      <div class="auth__footer">
        <a href="index.html" class="auth__footer-link">← Volver al inicio</a>
      </div>

    </div>
  </main>

  <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
